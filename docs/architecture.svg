<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .lbl{fill:#1b2a4a;font-size:13px;}
      .title{fill:#0b1020;font-size:20px;font-weight:700;}
      .sub{fill:#5b6b8c;font-size:12px;}
      .box{rx:10;ry:10;stroke-width:1.5;}
      .cds{fill:#e8f2ff;stroke:#4f9dff;}
      .agent{fill:#eafaf3;stroke:#38d39f;}
      .data{fill:#fff4e3;stroke:#ffb454;}
      .core{fill:#f2ecff;stroke:#9b7bff;}
      .badge{font-size:11px;font-weight:700;}
      .flow{stroke:#8a97b8;stroke-width:1.6;fill:none;marker-end:url(#arrow);}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97b8"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">One Touch Resolve — Insurance Claims Coordination Agent</text>
  <text x="40" y="62" class="sub">AWS Communication Developer Services (EUM SMS/RCS · EUM Social WhatsApp · SES) orchestrated by Amazon Bedrock AgentCore</text>

  <!-- Parties -->
  <rect class="box cds" x="40" y="100" width="220" height="150"/>
  <text x="52" y="122" class="badge" fill="#2a6fd6">EXTERNAL PARTIES</text>
  <text x="52" y="148" class="lbl">Policyholder — WhatsApp</text>
  <text x="52" y="172" class="lbl">Repair shop — RCS / SMS</text>
  <text x="52" y="196" class="lbl">Parts supplier — Email</text>
  <text x="52" y="220" class="lbl">Lienholder — Email</text>

  <!-- CDS channels -->
  <rect class="box cds" x="320" y="100" width="230" height="150"/>
  <text x="332" y="122" class="badge" fill="#2a6fd6">AWS CDS CHANNELS</text>
  <text x="332" y="148" class="lbl">AWS End User Messaging</text>
  <text x="332" y="168" class="sub">SMS · RCS (RCS→SMS fallback)</text>
  <text x="332" y="192" class="lbl">EUM Social — WhatsApp</text>
  <text x="332" y="216" class="lbl">Amazon SES — email</text>

  <!-- SNS -->
  <rect class="box data" x="620" y="120" width="150" height="60"/>
  <text x="632" y="145" class="badge" fill="#c77d1a">Amazon SNS</text>
  <text x="632" y="166" class="sub">inbound fan-in</text>

  <!-- Dispatcher -->
  <rect class="box agent" x="620" y="230" width="150" height="70"/>
  <text x="632" y="255" class="badge" fill="#1f9d6b">Dispatcher</text>
  <text x="632" y="274" class="sub">AWS Lambda</text>
  <text x="632" y="290" class="sub">normalize · dedupe</text>

  <!-- AgentCore -->
  <rect class="box core" x="360" y="330" width="450" height="230"/>
  <text x="378" y="356" class="badge" fill="#7a53e0">AMAZON BEDROCK AGENTCORE RUNTIME</text>
  <text x="378" y="378" class="sub">Supervisor (Strands SDK · Amazon Nova Pro)</text>

  <rect class="box agent" x="378" y="392" width="200" height="54"/>
  <text x="390" y="414" class="lbl">Specialist sub-agents</text>
  <text x="390" y="432" class="sub">Claimant · RepairShop · Parts · Lien</text>

  <rect class="box data" x="596" y="392" width="196" height="54"/>
  <text x="608" y="414" class="lbl">Commit gate</text>
  <text x="608" y="432" class="sub">block until all parties commit</text>

  <rect class="box core" x="378" y="460" width="414" height="44"/>
  <text x="390" y="487" class="lbl">AgentCore Memory — one claim state per actor_id (cross-channel)</text>

  <rect class="box agent" x="378" y="514" width="414" height="36"/>
  <text x="390" y="537" class="sub">Tools (Lambda): open_claim · request_estimate · check_parts_eta · notify_lienholder · evaluate_commit_gate · issue_settlement</text>

  <!-- DynamoDB -->
  <rect class="box data" x="880" y="330" width="240" height="90"/>
  <text x="892" y="356" class="badge" fill="#c77d1a">Amazon DynamoDB</text>
  <text x="892" y="380" class="lbl">coe-claims (claim_id)</text>
  <text x="892" y="402" class="lbl">coe-parties (claim_id, role)</text>

  <!-- S3 -->
  <rect class="box data" x="880" y="440" width="240" height="60"/>
  <text x="892" y="465" class="badge" fill="#c77d1a">Amazon S3</text>
  <text x="892" y="486" class="sub">inbound media (FNOL photos/video)</text>

  <!-- Outbound CDS -->
  <rect class="box cds" x="880" y="120" width="240" height="90"/>
  <text x="892" y="145" class="badge" fill="#2a6fd6">OUTBOUND (AWS CDS)</text>
  <text x="892" y="168" class="lbl">RCS→SMS · WhatsApp · SES</text>
  <text x="892" y="190" class="sub">SendTextMessage · SendWhatsAppMessage · SendEmail</text>

  <!-- flows -->
  <path class="flow" d="M260 175 L320 175"/>
  <path class="flow" d="M550 165 L620 150"/>
  <path class="flow" d="M695 180 L695 230"/>
  <path class="flow" d="M695 300 L640 330"/>
  <path class="flow" d="M810 445 L880 460"/>
  <path class="flow" d="M810 375 L880 375"/>
  <path class="flow" d="M695 330 L800 210"/>
  <path class="flow" d="M810 165 L880 165" />

  <text x="40" y="620" class="sub">Claim lifecycle: NEW → FNOL_CAPTURED → PARTIES_ENGAGED → COMMITTED → SETTLED</text>
  <text x="40" y="644" class="sub">Differentiators: (1) multi-party commit gate  (2) channel-aware continuity (RCS→SMS with preserved state)</text>
  <text x="40" y="668" class="sub">One-command deploy via AWS CDK · least-privilege IAM · SNS DLQ · CloudWatch metrics</text>
</svg>
